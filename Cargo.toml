[package]
name = "ccs"
version = "0.9.2"
edition = "2021"
license = "0BSD"
repository = "https://github.com/museun/ccs"

[dependencies]
anstream = "0.6.18"
anyhow = "1.0.95"
clap = { version = "4.5.24", features = [ "wrap_help" ] }
directories = "5.0.1"
ignore = "0.4.23"
jiff = "0.1.21"
notify-debouncer-mini = "0.5.0"
owo-colors = { version = "4.1.0", features = [ "supports-color" ] }
serde = { version = "1.0.217", features = [ "derive" ] }
serde_json = "1.0.135"
str_indices = "0.4.4"
toml = "0.8.19"
